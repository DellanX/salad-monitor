version: '3.8'

services:
  salad-monitor:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: salad-monitor
    restart: unless-stopped
    ports:
      - "8765:8765"
    volumes:
      # Bind-mount Salad log directory read-only
      - type: bind
        source: C:\ProgramData\Salad\logs
        target: /app/logs
        read_only: true
      - salad_monitor_data:/app/data
    environment:
      - SALAD_LOG_DIR=/app/logs
      - NVIDIA_DRIVER_CAPABILITIES=utility,compute
      - NVIDIA_VISIBLE_DEVICES=all
      # Additional environment variables for WSL2 GPU access
      - NVIDIA_REQUIRE_CUDA=cuda>=11.0
    # Optional: uncomment pid: host to enable per-process GPU attribution in NVML
    # pid: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu, utility, compute]
    # Ensure GPU access on WSL2 with Docker Desktop
    runtime: nvidia

volumes:
  salad_monitor_data:
