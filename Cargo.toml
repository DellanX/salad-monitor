[workspace]
resolver = "2"
members = [
    "crates/salad-monitord",
    "crates/salad-collect",
    "crates/salad-logparse",
    "crates/salad-webhook"
]

[workspace.package]
version = "1.0.0"
edition = "2021"
authors = ["Della <della@users.noreply.github.com>"]
license = "MIT"
repository = "https://github.com/dellanx/salad-monitor"

[workspace.dependencies]
tokio = { version = "1.38", features = ["full"] }
axum = { version = "0.7", features = ["macros"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "fs", "trace"] }
tower_governor = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sysinfo = "0.30"
nvml-wrapper = "0.13"
rusqlite = { version = "0.31", features = ["bundled"] }
mdns-sd = "0.11"
rust-embed = "8.4"
jsonwebtoken = "9.3"
argon2 = "0.5"
regex = "1.10"
once_cell = "1.19"
reqwest = { version = "0.12", features = ["json"] }
rand = "0.8"
sha2 = "0.10"
hmac = "0.12"
futures = "0.3"
tokio-stream = "0.1"
mime_guess = "2.0"
